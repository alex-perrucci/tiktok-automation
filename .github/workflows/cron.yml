name: Bot Generatore Video

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # <-- Aggiornato a 3.11

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"//g' /etc/ImageMagick-6/policy.xml

      - name: Installa librerie Python
        # <-- Abbiamo inserito google-genai e bloccato moviepy
        run: pip install feedparser google-genai edge-tts moviepy==1.0.3 requests

      - name: Esegui Script Generazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Salva Memoria (Commit links)
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add processed_links.txt
          git commit -m "Notizia processata" || exit 0
          git push

      - name: Salva il Video Finito come Artefatto
        uses: actions/upload-artifact@v4
        # <-- Aggiungiamo un if per non dare errore se il video non viene creato
        if: always()
        with:
          name: video-generato
          path: final_video.mp4
          if-no-files-found: ignore