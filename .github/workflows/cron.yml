name: Generate manual short video

on:
  workflow_dispatch:
    inputs:
      use_manual_script:
        description: "Use input/manual_script.json instead of RSS + Gemini"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      dry_run:
        description: "Generate script/QC only, without rendering the video"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
      - codex/relationship-manual-mvp
    paths:
      - input/manual_script.json
      - .github/workflows/cron.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Smoke test video stack
        run: |
          python - <<'PY'
          from pathlib import Path
          from moviepy.editor import ColorClip

          output = Path('/tmp/moviepy-smoke.mp4')
          clip = ColorClip(size=(90, 160), color=(20, 30, 40), duration=0.2).resize((180, 320))
          clip.write_videofile(
              str(output),
              fps=10,
              codec='libx264',
              audio=False,
              logger=None,
          )
          clip.close()
          assert output.exists() and output.stat().st_size > 0, 'MoviePy/ffmpeg smoke render failed'
          print('MoviePy/Pillow/ffmpeg smoke render passed.')
          PY

      - name: Generate package and deliver to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_BG_MUSIC: ${{ vars.USE_BG_MUSIC }}
          TARGET_DURATION_HIGH: "100"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python run_manual.py
          elif [ "${{ inputs.use_manual_script }}" = "true" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python run_manual.py --dry-run
            else
              python run_manual.py
            fi
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py --once
          fi

      - name: Save run state
        if: ${{ success() && inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -f processed_links.txt ]; then
            git add processed_links.txt
          fi
          if [ -f videos_log.csv ]; then
            git add videos_log.csv
          fi
          git diff --staged --quiet || git commit -m "Update short video run state"
          git push

      - name: Upload manual package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-upload-package
          path: |
            output/**
            videos_log.csv
          if-no-files-found: ignore
          retention-days: 1
