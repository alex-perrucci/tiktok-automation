name: Generate manual short video

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate script/QC only, without rendering the video"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_BG_MUSIC: ${{ vars.USE_BG_MUSIC }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py --once
          fi

      - name: Save run state
        if: ${{ success() && inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add processed_links.txt
          if [ -f videos_log.csv ]; then
            git add videos_log.csv
          fi
          git diff --staged --quiet || git commit -m "Update short video run state"
          git push

      - name: Upload manual package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-upload-package
          path: |
            output/**
            videos_log.csv
          if-no-files-found: ignore
